  - title: 积雨辋川庄作
    year: 752
    city: 辋川
    genre: 诗
    text: |
      积雨空林烟火迟，蒸藜炊黍饷东菑。
      漠漠水田飞白鹭，阴阴夏木啭黄鹂。
      山中习静观朝槿，松下清斋折露葵。
      野老与人争席罢，海鸥何事更相疑。
    background: 辋川积雨夏日庄居之景，写田园清淡与隐居悟道之怀。
    famous: [漠漠水田飞白鹭，阴阴夏木啭黄鹂, 积雨空林烟火迟，蒸藜炊黍饷东菑]
