  - title: 辛夷坞
    year: 752
    city: 辋川
    genre: 诗
    text: |
      木末芙蓉花，山中发红萼。
      涧户寂无人，纷纷开且落。
    background: 《辋川集》之一，写辛夷坞芙蓉花自开自落，寓禅寂之理。
    famous: [涧户寂无人，纷纷开且落, 木末芙蓉花，山中发红萼]
