works:
  - title: 九月九日忆山东兄弟
    year: 717
    city: 长安
    genre: 诗
    text: |
      独在异乡为异客，每逢佳节倍思亲。
      遥知兄弟登高处，遍插茱萸少一人。
    background: 少年游长安求学，重阳思乡念蒲州诸弟，以「山东」指华山以东之故乡。
    famous: [独在异乡为异客，每逢佳节倍思亲, 遥知兄弟登高处，遍插茱萸少一人]
    source: 陈铁民《王维年谱》系十七岁长安作
    uncertain: 系年依年谱推断，无直接史料，主流作十七岁长安作
  - title: 使至塞上
    year: 737
    city: 凉州
    genre: 诗
    text: |
      单车欲问边，属国过居延。
      征蓬出汉塞，归雁入胡天。
      大漠孤烟直，长河落日圆。
      萧关逢候骑，都护在燕然。
    background: 开元二十五年以监察御史出使凉州宣慰河西节度使崔希逸，途中作此，写塞外苍茫壮阔之景。
    famous: [大漠孤烟直，长河落日圆, 征蓬出汉塞，归雁入胡天]
    source: 陈铁民《王维年谱》系开元二十五年出使凉州途中
  - title: 观猎
    year: 740
    city: 长安
    genre: 诗
    text: |
      风劲角弓鸣，将军猎渭城。
      草枯鹰眼疾，雪尽马蹄轻。
      忽过新丰市，还归细柳营。
      回看射雕处，千里暮云平。
    background: 诗中渭城、新丰市、细柳营皆长安近畿地名，写将军冬猎之壮，系地长安一带。
    famous: [风劲角弓鸣，将军猎渭城, 草枯鹰眼疾，雪尽马蹄轻]
    source: 赵殿成《王右丞集笺注》；陈铁民《王维年谱》系地长安近畿
    uncertain: 系年无确考，诗中地名属长安近畿，姑系开元末归朝后长安作
  - title: 送沈子福归江东
    year: 740
    city: 襄阳
    genre: 诗
    text: |
      杨柳渡头行客稀，罟师荡桨向临圻。
      惟有相思似春色，江南江北送君归。
    background: 送友人沈子福归江东，江畔渡头作别，以春色喻相思情深。
    famous: [惟有相思似春色，江南江北送君归]
    source: 赵殿成《王右丞集笺注》
    uncertain: 系年系地无定论，一说知南选赴桂州途中江汉一带作，姑系襄阳
  - title: 终南山
    year: 750
    city: 辋川
    genre: 诗
    text: |
      太乙近天都，连山接海隅。
      白云回望合，青霭入看无。
      分野中峰变，阴晴众壑殊。
      欲投人处宿，隔水问樵夫。
    background: 写终南山（太乙）雄峻，辋川别业即在终南山沿，系辋川时期作。
    famous: [白云回望合，青霭入看无, 欲投人处宿，隔水问樵夫]
    source: 赵殿成《王右丞集笺注》；陈铁民谱系辋川时期
    uncertain: 系年无确考，多系天宝辋川时期，姑系天宝九载前后
  - title: 山居秋暝
    year: 750
    city: 辋川
    genre: 诗
    text: |
      空山新雨后，天气晚来秋。
      明月松间照，清泉石上流。
      竹喧归浣女，莲动下渔舟。
      随意春芳歇，王孙自可留。
    background: 辋川秋日雨后山居之景，写隐居自得之趣。
    famous: [明月松间照，清泉石上流, 竹喧归浣女，莲动下渔舟]
    source: 赵殿成《王右丞集笺注》；陈铁民谱系辋川时期
    uncertain: 系年无确考，姑系天宝九载前后辋川作
  - title: 鹿柴
    year: 752
    city: 辋川
    genre: 诗
    text: |
      空山不见人，但闻人语响。
      返景入深林，复照青苔上。
    background: 《辋川集》之一，写鹿柴（辋川一景）空山深林幽寂之境，融禅意。
    famous: [空山不见人，但闻人语响, 返景入深林，复照青苔上]
    source: 《辋川集并序》；赵殿成《王右丞集笺注》系辋川别业作
    uncertain: 系年无确考，姑系天宝中辋川作
  - title: 竹里馆
    year: 752
    city: 辋川
    genre: 诗
    text: |
      独坐幽篁里，弹琴复长啸。
      深林人不知，明月来相照。
    background: 《辋川集》之一，写独坐竹里馆弹琴长啸、明月相照之独处之乐。
    famous: [独坐幽篁里，弹琴复长啸, 深林人不知，明月来相照]
