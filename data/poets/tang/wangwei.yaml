  - title: 辋川闲居赠裴秀才迪
    year: 752
    city: 辋川
    genre: 诗
    text: |
      寒山转苍翠，秋水日潺湲。
      倚杖柴门外，临风听暮蝉。
      渡头余落日，墟里上孤烟。
      复值接舆醉，狂歌五柳前。
    background: 辋川闲居赠道友裴迪，写秋日山村暮景与裴迪醉歌之狂，以接舆、五柳先生自况。
    famous: [渡头余落日，墟里上孤烟, 倚杖柴门外，临风听暮蝉]
    source: 旧唐书·王维传「与道友裴迪浮舟往来」；赵殿成系辋川闲居作
