  - title: 送元二使安西
    year: 755
    city: 长安
    genre: 诗
    text: |
      渭城朝雨浥轻尘，客舍青青柳色新。
      劝君更尽一杯酒，西出阳关无故人。
    background: 长安送友人元二赴安西都护府，渭城即长安西郊，作别酒之作，后谱为《阳关三叠》。
    famous: [劝君更尽一杯酒，西出阳关无故人, 渭城朝雨浥轻尘，客舍青青柳色新]
