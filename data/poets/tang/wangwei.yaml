  - title: 菩提寺禁裴迪来相看说逆贼等凝碧池上作音乐供奉人等举声便一时泪下私成口号诵示裴迪
    year: 756
    city: 洛阳
    genre: 诗
    text: |
      万户伤心生野烟，百官何日更朝天。
      秋槐叶落空宫里，凝碧池头奏管弦。
    background: 被拘洛阳普施寺，裴迪来探，告以安禄山凝碧池宴乐工雷海青拒奏殉节事，维闻之悲痛，私成此口号诵示裴迪。乱平后此诗闻于行在，肃宗特宥其罪。
    famous: [万户伤心生野烟，百官何日更朝天, 秋槐叶落空宫里，凝碧池头奏管弦]
    source: 旧唐书·王维传「维以《凝碧》诗闻于行在，肃宗特宥之」；赵殿成《王右丞集笺注》
  - title: 和贾至舍人早朝大明宫之作
    year: 758
    city: 长安
    genre: 诗
    text: |
      绛帻鸡人报晓筹，尚衣方进翠云裘。
      九天阊阖开宫殿，万国衣冠拜冕旒。
      日色才临仙掌动，香烟欲傍衮龙浮。
      朝罢须裁五色诏，佩声归到凤池头。
    background: 乾元元年春，中书舍人贾至作《早朝大明宫呈两省僚友》，王维、杜甫、岑参皆有和作，此为王维和诗，写大明宫早朝盛景。
    famous: [九天阊阖开宫殿，万国衣冠拜冕旒, 绛帻鸡人报晓筹，尚衣方进翠云裘]
    source: 赵殿成《王右丞集笺注》；陈铁民谱系乾元元年长安
  - title: 酬张少府
    year: 758
    city: 辋川
    genre: 诗
    text: |
      晚年唯好静，万事不关心。
      自顾无长策，空知返旧林。
      松风吹解带，山月照弹琴。
      君问穷通理，渔歌入浦深。
    background: 晚年居辋川，答张少府见赠，自言好静归隐，以松风山月、渔歌寄穷通之理。
    famous: [晚年唯好静，万事不关心, 松风吹解带，山月照弹琴]
    source: 赵殿成《王右丞集笺注》；陈铁民谱系晚年辋川作
    uncertain: 系年无确考，多系晚年辋川，姑系乾元元年前后
