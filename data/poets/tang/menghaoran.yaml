works:
  - title: 春晓
    year: 716
    city: 襄阳
    genre: 诗
    text: |
      春眠不觉晓，处处闻啼鸟。
      夜来风雨声，花落知多少。
    background: 隐居鹿门山时作，写春晨醒后闻鸟啼、念夜来风雨落花，清浅自然，为流传最广的春晓绝句。
    famous: [春眠不觉晓，处处闻啼鸟, 夜来风雨声，花落知多少]
    source: 佟培基《孟浩然年谱》系鹿门隐居期襄阳作
  - title: 夜归鹿门山歌
    year: 716
    city: 襄阳
    genre: 诗
    text: |
      山寺钟鸣昼已昏，渔梁渡头争渡喧。
      人随沙岸向江村，余亦乘舟归鹿门。
      鹿门月照开烟树，忽到庞公栖隐处。
      岩扉松径长寂寥，惟有幽人独来去。
    background: 隐居鹿门山时，夜归鹿门，写渔梁渡头喧闹与鹿门山幽寂对照，借庞德公栖隐事明志。
    famous: [鹿门月照开烟树，忽到庞公栖隐处, 岩扉松径长寂寥，惟有幽人独来去]
    source: 佟培基《孟浩然年谱》系鹿门隐居期襄阳作
  - title: 过故人庄
    year: 717
    city: 襄阳
    genre: 诗
    text: |
      故人具鸡黍，邀我至田家。
      绿树村边合，青山郭外斜。
      开轩面场圃，把酒话桑麻。
      待到重阳日，还来就菊花。
    background: 隐居襄阳时应故人田家之邀，写农家待客淳朴与田园闲适，为盛唐田园诗代表作。
    famous: [绿树村边合，青山郭外斜, 开轩面场圃，把酒话桑麻]
    source: 佟培基《孟浩然年谱》系开元初襄阳田园作
  - title: 夏日南亭怀辛大
    year: 718
    city: 襄阳
    genre: 诗
    text: |
      山光忽西落，池月渐东上。
      散发乘夕凉，开轩卧闲敞。
      荷风送香气，竹露滴清响。
      欲取鸣琴弹，恨无知音赏。
      感此怀故人，中宵劳梦想。
    background: 夏夜于襄阳南亭纳凉，感荷风竹露，怀故人辛大，寄知音难觅之思。
    famous: [荷风送香气，竹露滴清响, 欲取鸣琴弹，恨无知音赏]
    source: 佟培基《孟浩然年谱》系襄阳南亭作
  - title: 秋登万山寄张五
    year: 720
    city: 襄阳
    genre: 诗
    text: |
      北山白云里，隐者自怡悦。
      相望试登高，心随雁飞灭。
      愁因薄暮起，兴是清秋发。
      时见归村人，沙行渡头歇。
      天边树若荠，江畔洲如月。
      何当载酒来，共醉重阳节。
    background: 秋日登襄阳万山，望北山隐者，怀友人张五，寄相邀重阳共饮之约。
    famous: [天边树若荠，江畔洲如月, 愁因薄暮起，兴是清秋发]
    source: 佟培基《孟浩然年谱》系开元八年前后襄阳万山作
  - title: 万山潭作
    year: 720
    city: 襄阳
    genre: 诗
    text: |
      垂钓坐磐石，水清心益闲。
      唯有垂纶者，悠然三十年。
    background: 游襄阳万山潭，垂钓磐石之上，写水清心闲、悠然自得之趣。
    famous: [垂钓坐磐石，水清心益闲]
    source: 佟培基《孟浩然年谱》系襄阳万山作
  - title: 与诸子登岘山
    year: 725
    city: 襄阳
    genre: 诗
    text: |
      人事有代谢，往来成古今。
      江山留胜迹，我辈复登临。
      水落鱼梁浅，天寒梦泽深。
      羊公碑尚在，读罢泪沾襟。
    background: 与诸子登襄阳岘山，谒羊祜堕泪碑，慨叹人事代谢、江山胜迹，伤羊公遗爱。
    famous: [人事有代谢，往来成古今, 江山留胜迹，我辈复登临, 羊公碑尚在，读罢泪沾襟]
    source: 佟培基《孟浩然年谱》系开元中襄阳岘山作
  - title: 岁暮归南山
    year: 728
    city: 长安
    genre: 诗
    text: |
      北阙休上书，南山归敝庐。
      不才明主弃，多病故人疏。
      白发催年老，青阳逼岁除。
      永怀愁不寐，松月夜窗虚。
    background: 应进士不第、内署诵诗忤旨放还后，归终南山（南山）敝庐，抒怀才不遇、见弃明主之怨。即《新唐书》所载「不才明主弃」忤玄宗之诗。
    famous: [不才明主弃，多病故人疏, 北阙休上书，南山归敝庐]
    source: 新唐书·文艺传中「浩然自诵所为诗，至「不才明主弃」……放归襄阳」；佟培基年谱系开元十六年长安放还时作
    uncertain: 一说此诗即《归终南山》或《归南山》，系年从开元十六年放还说
  - title: 留别王维
    year: 728
    city: 长安
    genre: 诗
    text: |
      寂寂竟何待，朝朝空自归。
      欲寻芳草去，惜与故人违。
      当路谁相假，知音世所稀。
      只应守寂寞，还掩故园扉。
    background: 应举不第、忤旨放还，离长安归襄阳，留别知音王维，抒当路无人、知音难遇之叹。
    famous: [当路谁相假，知音世所稀, 欲寻芳草去，惜与故人违]
    source: 佟培基《孟浩然年谱》系开元十六年离长安留别王维作
  - title: 自洛之越
    year: 729
    city: 洛阳
    genre: 诗
    text: |
      遑遑三十载，书剑两无成。
      山水寻吴越，风尘厌洛京。
      扁舟泛湖海，长揖谢公卿。
      且乐杯中物，谁论世上名。
    background: 开元十七年秋自洛阳动身漫游吴越，抒半生无成、厌弃洛京风尘、寄情山水之意。
    famous: [山水寻吴越，风尘厌洛京, 且乐杯中物，谁论世上名]
    source: 佟培基《孟浩然年谱》系开元十七年秋自洛之越作；诗题自述
  - title: 与颜钱塘登障楼望潮作
    year: 730
    city: 钱塘
    genre: 诗
    text: |
      百里闻雷震，鸣弦暂辍弹。
      府中连骑出，江上待潮观。
      照日秋云迥，浮天渤澥宽。
      惊涛来似雪，一坐凛生寒。
    background: 游钱塘（杭州），与钱塘令颜某登障楼观浙江潮，写海潮来如雪、凛然生寒之景。
    famous: [惊涛来似雪，一坐凛生寒, 照日秋云迥，浮天渤澥宽]
    source: 佟培基《孟浩然年谱》系开元十八年钱塘观潮作；诗题「钱塘」
  - title: 宿桐庐江寄广陵旧游
    year: 731
    city: 钱塘
    genre: 诗
    text: |
      山暝闻猿愁，沧江急夜流。
      风鸣两岸叶，月照一孤舟。
      建德非吾土，维扬忆旧游。
      还将两行泪，遥寄海西头。
    background: 漫游吴越夜宿桐庐江（建德江上游），闻猿愁、对孤舟，忆广陵（维扬）旧游，寄遥思。
    famous: [风鸣两岸叶，月照一孤舟, 建德非吾土，维扬忆旧游]
    source: 佟培基《孟浩然年谱》系开元十九年吴越水路途中作
    uncertain: 桐庐江、建德江在睦州，坐标表未注册睦州/建德，姑系钱塘（同属江南东道钱塘江水系，睦州在钱塘江上游）
  - title: 宿建德江
    year: 731
    city: 钱塘
    genre: 诗
    text: |
      移舟泊烟渚，日暮客愁新。
      野旷天低树，江清月近人。
    background: 漫游吴越，移舟夜泊建德江（睦州桐庐江下游），写日暮烟渚、野旷江清之景与客愁。
    famous: [野旷天低树，江清月近人, 移舟泊烟渚，日暮客愁新]
    source: 佟培基《孟浩然年谱》系开元十九年吴越水路途中作
    uncertain: 建德江在睦州建德（今浙江建德），坐标表未注册建德/睦州，姑系钱塘（建德江为钱塘江上游支流，同属江南东道）
  - title: 晚泊浔阳望庐山
    year: 732
    city: 浔阳
    genre: 诗
    text: |
      挂席几千里，名山都未逢。
      泊舟浔阳郭，始见香炉峰。
      尝读远公传，永怀尘外踪。
      东林精舍近，日暮空闻钟。
    background: 吴越归途晚泊浔阳（九江），始望庐山香炉峰，怀东晋慧远远公，闻东林寺钟声。
    famous: [泊舟浔阳郭，始见香炉峰, 东林精舍近，日暮空闻钟]
    source: 佟培基《孟浩然年谱》系开元二十年归途过浔阳作
  - title: 彭蠡湖中望庐山
    year: 732
    city: 浔阳
    genre: 诗
    text: |
      太虚生月晕，舟子知天风。
      挂席候明发，渺漫平湖中。
      中流见匡庐，势压九江雄。
      黤黕凝黛色，峥嵘当曙空。
      香炉初上日，瀑水喷成虹。
      昔者尚沿历，今兹其未能。
      欲辨昨夜雨，况闻岩下声。
    background: 吴越归途经彭蠡湖（鄱阳湖），望庐山日出、香炉峰瀑布，写匡庐雄秀。
    famous: [中流见匡庐，势压九江雄, 香炉初上日，瀑水喷成虹]
    source: 佟培基《孟浩然年谱》系开元二十年归途过彭蠡作
  - title: 望洞庭湖赠张丞相
    year: 733
    city: 岳阳
    genre: 诗
    text: |
      八月湖水平，涵虚混太清。
      气蒸云梦泽，波撼岳阳城。
      欲济无舟楫，端居耻圣明。
      坐观垂钓者，徒有羡鱼情。
    background: 归途过洞庭湖，望湖壮景，干谒张九龄（张丞相）求汲引，以「欲济无舟楫」喻求仕之意。
    famous: [气蒸云梦泽，波撼岳阳城, 欲济无舟楫，端居耻圣明, 坐观垂钓者，徒有羡鱼情]
    source: 佟培基《孟浩然年谱》系开元二十一年过洞庭作；诗题「赠张丞相」，张九龄开元二十一年拜中书令
  - title: 早寒江上有怀
    year: 734
    city: 襄阳
    genre: 诗
    text: |
      木落雁南度，北风江上寒。
      我家襄水曲，遥隔楚云端。
      乡泪客中尽，孤帆天际看。
      迷津欲有问，平海夕漫漫。
    background: 归襄阳后于汉水江上感早寒，思乡怀归，以「迷津欲有问」寓仕途迷惘。
    famous: [木落雁南度，北风江上寒, 我家襄水曲，遥隔楚云端]
    source: 佟培基《孟浩然年谱》系归襄阳后江上作
    uncertain: 系年系地难确，姑系开元二十二年归襄阳后汉水江上作
