works:
  - title: 赋得古原草送别
    year: 788
    city: 长安
    genre: 诗
    text: |
      离离原上草，一岁一枯荣。
      野火烧不尽，春风吹又生。
      远芳侵古道，晴翠接荒城。
      又送王孙去，萋萋满别情。
    background: 少年应试习作，借咏原上野草抒送别之情，「野火烧不尽，春风吹又生」传诵千古。
    famous: [野火烧不尽，春风吹又生, 远芳侵古道，晴翠接荒城]
    source: 朱金城《白居易集笺校》系少年习作；旧唐书载携诗谒顾况事
    uncertain: 系年有贞元二、三年（786—787）及稍后诸说，且与避乱江南时间线相参差；谒顾况事朱金城疑为附会。姑系贞元四年（788）长安
  - title: 长恨歌
    year: 806
    city: 盩厔
    genre: 诗
    text: |
      汉皇重色思倾国，御宇多年求不得。
      杨家有女初长成，养在深闺人未识。
      天生丽质难自弃，一朝选在君王侧。
      回眸一笑百媚生，六宫粉黛无颜色。
      春寒赐浴华清池，温泉水滑洗凝脂。
      侍儿扶起娇无力，始是新承恩泽时。
      云鬓花颜金步摇，芙蓉帐暖度春宵。
      春宵苦短日高起，从此君王不早朝。
      承欢侍宴无闲暇，春从春游夜专夜。
      后宫佳丽三千人，三千宠爱在一身。
      金屋妆成娇侍夜，玉楼宴罢醉和春。
      姊妹弟兄皆列土，可怜光彩生门户。
      遂令天下父母心，不重生男重生女。
      骊宫高处入青云，仙乐风飘处处闻。
      缓歌慢舞凝丝竹，尽日君王看不足。
      渔阳鼙鼓动地来，惊破霓裳羽衣曲。
      九重城阙烟尘生，千乘万骑西南行。
      翠华摇摇行复止，西出都门百余里。
      六军不发无奈何，宛转蛾眉马前死。
      花钿委地无人收，翠翘金雀玉搔头。
      君王掩面救不得，回看血泪相和流。
      黄埃散漫风萧索，云栈萦纡登剑阁。
      峨嵋山下少人行，旌旗无光日色薄。
      蜀江水碧蜀山青，圣主朝朝暮暮情。
      行宫见月伤心色，夜雨闻铃肠断声。
      天旋地转回龙驭，到此踌躇不能去。
      马嵬坡下泥土中，不见玉颜空死处。
      君臣相顾尽沾衣，东望都门信马归。
      归来池苑皆依旧，太液芙蓉未央柳。
      芙蓉如面柳如眉，对此如何不泪垂。
      春风桃李花开日，秋雨梧桐叶落时。
      西宫南内多秋草，落叶满阶红不扫。
      梨园弟子白发新，椒房阿监青娥老。
      夕殿萤飞思悄然，孤灯挑尽未成眠。
      迟迟钟鼓初长夜，耿耿星河欲曙天。
      鸳鸯瓦冷霜华重，翡翠衾寒谁与共。
      悠悠生死别经年，魂魄不曾来入梦。
      临邛道士鸿都客，能以精诚致魂魄。
      为感君王辗转思，遂教方士殷勤觅。
      排空驭气奔如电，升天入地求之遍。
      上穷碧落下黄泉，两处茫茫皆不见。
      忽闻海上有仙山，山在虚无缥缈间。
      楼阁玲珑五云起，其中绰约多仙子。
      中有一人字太真，雪肤花貌参差是。
      金阙西厢叩玉扃，转教小玉报双成。
      闻道汉家天子使，九华帐里梦魂惊。
      揽衣推枕起徘徊，珠箔银屏迤逦开。
      云鬓半偏新睡觉，花冠不整下堂来。
      风吹仙袂飘飖举，犹似霓裳羽衣舞。
      玉容寂寞泪阑干，梨花一枝春带雨。
      含情凝睇谢君王，一别音容两渺茫。
      昭阳殿里恩爱绝，蓬莱宫中日月长。
      回头下望人寰处，不见长安见尘雾。
      惟将旧物表深情，钿合金钗寄将去。
      钗留一股合一扇，钗擘黄金合分钿。
      但教心似金钿坚，天上人间会相见。
      临别殷勤重寄词，词中有誓两心知。
      七月七日长生殿，夜半无人私语时。
      在天愿作比翼鸟，在地愿为连理枝。
      天长地久有时尽，此恨绵绵无绝期。
    background: 元和元年冬，白居易于盩厔仙游寺与陈鸿、王质夫话及明皇杨妃事，应命作此长篇歌行，陈鸿为作《长恨歌传》并行。
    famous: [在天愿作比翼鸟，在地愿为连理枝, 天长地久有时尽，此恨绵绵无绝期, 回眸一笑百媚生，六宫粉黛无颜色]
    source: 陈鸿《长恨歌传》序「元和元年冬十二月，太原白乐天自校书郎尉于盩厔，予与琅邪王质夫家于是邑，暇日相携游仙游寺，话及此事……乐天因为《长恨歌》」
  - title: 观刈麦
    year: 806
    city: 盩厔
    genre: 诗
    text: |
      田家少闲月，五月人倍忙。
      夜来南风起，小麦覆陇黄。
      妇姑荷箪食，童稚携壶浆，
      相随饷田去，丁壮在南冈。
      足蒸暑土气，背灼炎天光，
      力尽不知热，但惜夏日长。
      复有贫妇人，抱子在其旁，
      右手秉遗穗，左臂悬敝筐。
      听其相顾言，闻者为悲伤。
      家田输税尽，拾此充饥肠。
      今我何功德，曾不事农桑。
      吏禄三百石，岁晏有余粮，
      念此私自愧，尽日不能忘。
    background: 元和元年任盩厔尉时，五月麦收见农人辛苦、贫妇拾穗，感己不事农桑而岁禄三百石，作此讽谕。
    famous: [足蒸暑土气，背灼炎天光, 念此私自愧，尽日不能忘]
    source: 朱金城《白居易集笺校》系元和元年盩厔尉任上作
  - title: 卖炭翁
    year: 809
    city: 长安
    genre: 诗
    text: |
      卖炭翁，伐薪烧炭南山中。
      满面尘灰烟火色，两鬓苍苍十指黑。
      卖炭得钱何所营？身上衣裳口中食。
      可怜身上衣正单，心忧炭贱愿天寒。
      夜来城外一尺雪，晓驾炭车辗冰辙。
      牛困人饥日已高，市南门外泥中歇。
      翩翩两骑来是谁？黄衣使者白衫儿。
      手把文书口称敕，回车叱牛牵向北。
      一车炭，千余斤，宫使驱将惜不得。
      半匹红纱一丈绫，系向牛头充炭直。
    background: 《新乐府》五十首其一，元和四年前后任左拾遗翰林学士时作，刺宫市之弊、宦官强夺民间货物。
    famous: [可怜身上衣正单，心忧炭贱愿天寒, 半匹红纱一丈绫，系向牛头充炭直]
    source: 朱金城《白居易集笺校》《新乐府》序系元和四年左右长安作
  - title: 轻肥
    year: 809
    city: 长安
    genre: 诗
    text: |
      意气骄满路，鞍马光照尘。
      借问何为者，人称是内臣。
      朱绂皆大夫，紫绶或将军。
      夸赴军中宴，走马去如云。
      樽罍溢九酝，水陆罗八珍。
      果擘洞庭橘，脍切天池鳞。
      食饱心自若，酒酣气益振。
      是岁江南旱，衢州人食人。
    background: 《秦中吟》十首之一，元和前后长安作，刺宦官骄奢淫逸，以「衢州人食人」反衬内臣宴乐。
    famous: [是岁江南旱，衢州人食人]
    source: 朱金城《白居易集笺校》《秦中吟》系元和初长安作
  - title: 同李十一醉忆元九
    year: 809
    city: 长安
    genre: 诗
    text: |
      花时同醉破春愁，醉折花枝作酒筹。
      忽忆故人天际去，计程今日到梁州。
    background: 元和四年春与李建（李十一）饮于长安，醉中忆元稹（元九）赴东川，计其行程当日正至梁州，后元稹果有《梁州梦》记之。
    famous: [花时同醉破春愁，醉折花枝作酒筹]
    source: 朱金城《白居易集笺校》系元和四年春长安；元稹《梁州梦》序互证
  - title: 琵琶行
    year: 816
    city: 浔阳
    genre: 诗
    text: |
      浔阳江头夜送客，枫叶荻花秋瑟瑟。
      主人下马客在船，举酒欲饮无管弦。
      醉不成欢惨将别，别时茫茫江浸月。
      忽闻水上琵琶声，主人忘归客不发。
      寻声暗问弹者谁，琵琶声停欲语迟。
      移船相近邀相见，添酒回灯重开宴。
      千呼万唤始出来，犹抱琵琶半遮面。
      转轴拨弦三两声，未成曲调先有情。
      弦弦掩抑声声思，似诉平生不得志。
      低眉信手续续弹，说尽心中无限事。
      轻拢慢捻抹复挑，初为霓裳后六幺。
      大弦嘈嘈如急雨，小弦切切如私语。
      嘈嘈切切错杂弹，大珠小珠落玉盘。
      间关莺语花底滑，幽咽泉流冰下难。
      冰泉冷涩弦凝绝，凝绝不通声暂歇。
      别有幽愁暗恨生，此时无声胜有声。
      银瓶乍破水浆迸，铁骑突出刀枪鸣。
      曲终收拨当心画，四弦一声如裂帛。
      东船西舫悄无言，唯见江心秋月白。
      沉吟放拨插弦中，整顿衣裳起敛容。
      自言本是京城女，家在虾蟆陵下住。
      十三学得琵琶成，名属教坊第一部。
      曲罢曾教善才服，妆成每被秋娘妒。
      五陵年少争缠头，一曲红绡不知数。
      钿头银篦击节碎，血色罗裙翻酒污。
      今年欢笑复明年，秋月春风等闲度。
      弟走从军阿姨死，暮去朝来颜色故。
      门前冷落鞍马稀，老大嫁作商人妇。
      商人重利轻别离，前月浮梁买茶去。
      去来江口守空船，绕船月明江水寒。
      夜深忽梦少年事，梦啼妆泪红阑干。
      我闻琵琶已叹息，又闻此语重唧唧。
      同是天涯沦落人，相逢何必曾相识！
      我从去年辞帝京，谪居卧病浔阳城。
      浔阳地僻无音乐，终岁不闻丝竹声。
      住近湓江地低湿，黄芦苦竹绕宅生。
      其间旦暮闻何物，杜鹃啼血猿哀鸣。
      春江花朝秋月夜，往往取酒还独倾。
      岂无山歌与村笛，呕哑嘲哳难为听。
      今夜闻君琵琶语，如听仙乐耳暂明。
      莫辞更坐弹一曲，为君翻作琵琶行。
      感我此言良久立，却坐促弦弦转急。
      凄凄不似向前声，满座重闻皆掩泣。
      座中泣下谁最多，江州司马青衫湿。
    background: 元和十一年秋，贬江州司马次年，送客浔阳江头，闻舟中长安故倡弹琵琶，感其身世与己沦落同，作此长篇歌行以寄。
    famous: [同是天涯沦落人，相逢何必曾相识, 千呼万唤始出来，犹抱琵琶半遮面, 大珠小珠落玉盘, 此时无声胜有声]
    source: 白居易《琵琶行》序「元和十年，予左迁九江郡司马……明年秋，送客湓浦口，闻舟中夜弹琵琶者」
  - title: 大林寺桃花
    year: 817
    city: 浔阳
    genre: 诗
    text: |
      人间四月芳菲尽，山寺桃花始盛开。
      长恨春归无觅处，不知转入此中来。
    background: 元和十二年四月，江州司马任上，游庐山大林寺，见山寺桃花方盛，感春光转入山中，作此记之。
    famous: [人间四月芳菲尽，山寺桃花始盛开, 长恨春归无觅处，不知转入此中来]
    source: 白居易《游大林寺序》「元和十二年四月九日，与河南元集虚……游大林寺」；朱金城系年
  - title: 村夜
    year: 816
    city: 浔阳
    genre: 诗
    text: |
      霜草苍苍虫切切，村南村北行人绝。
      独出门前望野田，月明荞麦花如雪。
    background: 贬江州司马期间，秋夜独步村前，见霜草虫鸣、荞麦花如雪，写谪居孤寂之况。
    famous: [独出门前望野田，月明荞麦花如雪, 霜草苍苍虫切切，村南村北行人绝]
    source: 朱金城《白居易集笺校》系元和十一年前后江州作
  - title: 建昌江
    year: 819
    city: 忠州
    genre: 诗
    text: |
      建昌江水县门前，立马教人唤渡船。
      忽似往年归蔡渡，草风沙雨渭河边。
    background: 元和十四年忠州刺史任上，立建昌江畔待渡，忆及下邽渭河蔡渡旧居，起归思。
    famous: [建昌江水县门前，立马教人唤渡船]
    source: 朱金城《白居易集笺校》系元和十四年忠州作
  - title: 钱塘湖春行
    year: 823
    city: 钱塘
    genre: 诗
    text: |
      孤山寺北贾亭西，水面初平云脚低。
      几处早莺争暖树，谁家新燕啄春泥。
      乱花渐欲迷人眼，浅草才能没马蹄。
      最爱湖东行不足，绿杨阴里白沙堤。
    background: 长庆三年春杭州刺史任上，骑马沿西湖孤山—白沙堤一线春行，写西湖早春明媚之景。
    famous: [几处早莺争暖树，谁家新燕啄春泥, 乱花渐欲迷人眼，浅草才能没马蹄]
    source: 朱金城《白居易集笺校》系长庆三年春杭州作
  - title: 春题湖上
    year: 823
    city: 钱塘
    genre: 诗
    text: |
      湖上春来似画图，乱峰围绕水平铺。
      松排山面千重翠，月点波心一颗珠。
      碧毯线头抽早稻，青罗裙带展新蒲。
      未能抛得杭州去，一半勾留是此湖。
    background: 长庆三年春杭州刺史任上，题咏西湖春色，末联「一半勾留是此湖」道尽留恋西湖之情。
    famous: [松排山面千重翠，月点波心一颗珠, 未能抛得杭州去，一半勾留是此湖]
    source: 朱金城《白居易集笺校》系长庆三年杭州作
  - title: 暮江吟
    year: 822
    city: 钱塘
    genre: 诗
    text: |
      一道残阳铺水中，半江瑟瑟半江红。
      可怜九月初三夜，露似真珠月似弓。
    background: 长庆二年秋赴杭州刺史任途中（一说到任后）作，写秋江暮色与初三新月的柔和清丽。
    famous: [一道残阳铺水中，半江瑟瑟半江红, 可怜九月初三夜，露似真珠月似弓]
    source: 朱金城《白居易集笺校》系长庆二年秋杭州作
    uncertain: 系年系地有赴杭途中说与杭州到任后说，姑从杭州说系钱塘
  - title: 白云泉
    year: 825
    city: 苏州
    genre: 诗
    text: |
      天平山上白云泉，云自无心水自闲。
      何必奔冲山下去，更添波浪向人间。
    background: 宝历二年苏州刺史任上，游天平山白云泉，借云水无心自闲，寄随缘任运、不愿复入尘俗之志。
    famous: [天平山上白云泉，云自无心水自闲]
    source: 朱金城《白居易集笺校》系宝历二年苏州作
  - title: 忆江南
    year: 838
    city: 洛阳
    genre: 词
    text: |
      江南好，风景旧曾谙。
      日出江花红胜火，春来江水绿如蓝。
      能不忆江南？
      江南忆，最忆是杭州。
      山寺月中寻桂子，郡亭枕上看潮头。
      何日更重游？
      江南忆，其次忆吴宫。
      吴酒一杯春竹叶，吴娃双舞醉芙蓉。
      早晚复相逢？
    background: 晚年分司东都退居洛阳，追忆早岁江南（杭州、苏州）旧游，作《忆江南》三首，为早期文人词名篇。
    famous: [日出江花红胜火，春来江水绿如蓝, 山寺月中寻桂子，郡亭枕上看潮头]
    source: 朱金城《白居易集笺校》系开成三年前后洛阳作
  - title: 问刘十九
    year: 838
    city: 洛阳
    genre: 诗
    text: |
      绿蚁新醅酒，红泥小火炉。
      晚来天欲雪，能饮一杯无？
    background: 晚年退居洛阳，冬夜新酒初熟、炉火正红，邀友人刘十九小饮，写闲适真率之趣。
    famous: [晚来天欲雪，能饮一杯无, 绿蚁新醅酒，红泥小火炉]
    source: 朱金城《白居易集笺校》系开成前后洛阳闲居作
