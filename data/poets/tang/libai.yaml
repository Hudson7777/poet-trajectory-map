summary:
  review: |
    李白（701—762），字太白，号青莲居士，唐代最负盛名的浪漫主义诗人。其先隋末徙西域，生于安西碎叶，五岁随父迁绵州昌隆青莲乡，少年隐岷山读书、任侠好剑。二十五岁出蜀，沿江东下，漫游江陵、金陵、扬州，后寓家安陆，与故相许圉师孙女成婚。天宝元年（742）经吴筠、贺知章荐举入长安，玄宗诏供奉翰林，名动一时，然为权贵所不容，三年后赐金放还。此后漫游梁宋、东鲁、吴越、幽燕，足迹半天下。安史乱起，避地庐山，至德二载（757）入永王李璘幕，璘败下浔阳狱，长流夜郎，乾元二年（759）行至白帝城遇赦东还。晚年依族叔当涂令李阳冰，宝应元年（762）病卒，年六十二。其诗以豪放飘逸、想象奇绝著称，与杜甫并称「李杜」，对后世影响至深。
  stats: { cities: 21, works: 存诗约千首, topOffice: 翰林供奉, age: 62 }
