works:
  - title: 访戴天山道士不遇
    year: 720
    city: 绵州
    genre: 诗
    text: |
      犬吠水声中，桃花带露浓。
      树深时见鹿，溪午不闻钟。
      野竹分青霭，飞泉挂碧峰。
      无人知所去，愁倚两三松。
    background: 少年隐岷山读书时访道士不遇，写绵州戴天山（大明寺山）清幽之景。
    famous: [树深时见鹿，溪午不闻钟, 野竹分青霭，飞泉挂碧峰]
    source: 詹瑛《李白诗文系年》系开元八年前后绵州作
  - title: 峨眉山月歌
    year: 724
    city: 渝州
    genre: 诗
    text: |
      峨眉山月半轮秋，影入平羌江水流。
      夜发清溪向三峡，思君下渝州。
    background: 开元十二年出蜀途中，自嘉州清溪夜发，经渝州下三峡，思乡之情。
    famous: [峨眉山月半轮秋，影入平羌江水流]
    source: 詹瑛《李白诗文系年》系开元十二年出蜀途中
  - title: 渡荆门送别
    year: 724
    city: 江陵
    genre: 诗
    text: |
      渡远荆门外，来从楚国游。
      山随平野尽，江入大荒流。
      月下飞天镜，云生结海楼。
      仍怜故乡水，万里送行舟。
    background: 出蜀经荆门山入楚地，舟行至江陵一带，抒离乡远游之情。
    famous: [山随平野尽，江入大荒流, 仍怜故乡水，万里送行舟]
    source: 詹瑛《李白诗文系年》系开元十二年出蜀至江陵作
  - title: 静夜思
    year: 726
    city: 扬州
    genre: 诗
    text: |
      床前明月光，疑是地上霜。
      举头望明月，低头思故乡。
    background: 开元十四年客游扬州旅舍，秋夜思乡，为流传最广的思乡绝句。
    famous: [床前明月光，疑是地上霜, 举头望明月，低头思故乡]
    source: 詹瑛《李白诗文系年》系开元十四年扬州客舍
  - title: 黄鹤楼送孟浩然之广陵
    year: 728
    city: 江夏
    genre: 诗
    text: |
      故人西辞黄鹤楼，烟花三月下扬州。
      孤帆远影碧空尽，唯见长江天际流。
    background: 开元十六年春，孟浩然东游扬州，李白于江夏（鄂州）黄鹤楼饯别作此。
    famous: [孤帆远影碧空尽，唯见长江天际流, 故人西辞黄鹤楼，烟花三月下扬州]
    source: 詹瑛《李白诗文系年》系开元十六年江夏送别
  - title: 蜀道难
    year: 742
    city: 长安
    genre: 诗
    text: |
      噫吁嚱，危乎高哉！
      蜀道之难，难于上青天！
      蚕丛及鱼凫，开国何茫然！
      尔来四万八千岁，不与秦塞通人烟。
      西当太白有鸟道，可以横绝峨眉巅。
      地崩山摧壮士死，然后天梯石栈相钩连。
      上有六龙回日之高标，下有冲波逆折之回川。
      黄鹤之飞尚不得过，猿猱欲度愁攀援。
      青泥何盘盘，百步九折萦岩峦。
      扪参历井仰胁息，以手抚膺坐长叹。
      问君西游何时还？畏途巉岩不可攀。
      但见悲鸟号古木，雄飞雌从绕林间。
      又闻子规啼夜月，愁空山。
      蜀道之难，难于上青天，使人听此凋朱颜！
      连峰去天不盈尺，枯松倒倚绝壁。
      飞湍瀑流争喧豗，砯崖转石万壑雷。
      其险也如此，嗟尔远道之人胡为乎来哉！
      剑阁峥嵘而崔嵬，一夫当关，万夫莫开。
      所守或匪亲，化为狼与豺。
      朝避猛虎，夕避长蛇，磨牙吮血，杀人如麻。
      锦城虽云乐，不如早还家。
      蜀道之难，难于上青天，侧身西望长咨嗟！
    background: 借送友人入蜀，极写蜀道险峻与世路艰险，寓政治忧患。贺知章读此叹为「谪仙人」。
    famous: [蜀道之难，难于上青天, 一夫当关，万夫莫开]
    source: 詹瑛《李白诗文系年》系天宝元年前作于长安
    uncertain: 系年有歧说：詹瑛主天宝初长安送王炎入蜀说；另有开元间初入长安前作、安史乱后作等说。今从詹瑛天宝初说
  - title: 清平调三首
    year: 743
    city: 长安
    genre: 诗
    text: |
      云想衣裳花想容，春风拂槛露华浓。
      若非群玉山头见，会向瑶台月下逢。
      一枝红艳露凝香，云雨巫山枉断肠。
      借问汉宫谁得似，可怜飞燕倚新妆。
      名花倾国两相欢，长得君王带笑看。
      解释春风无限恨，沉香亭北倚阑干。
    background: 天宝二年春，玄宗与杨贵妃赏牡丹于沉香亭，命李白作新词，白醉中赋《清平调》三首，由李龟年歌之。
    famous: [云想衣裳花想容，春风拂槛露华浓, 名花倾国两相欢，长得君王带笑看]
    source: 新唐书·文艺传中；詹瑛《李白诗文系年》系天宝二年长安
  - title: 行路难三首·其一
    year: 744
    city: 长安
    genre: 诗
    text: |
      金樽清酒斗十千，玉盘珍羞直万钱。
      停杯投箸不能食，拔剑四顾心茫然。
      欲渡黄河冰塞川，将登太行雪满山。
      闲来垂钓碧溪上，忽复乘舟梦日边。
      行路难，行路难，多歧路，今安在？
      长风破浪会有时，直挂云帆济沧海。
    background: 天宝三载赐金放还前夕，仕途受挫、去留两难之际作，抒怀才不遇之愤而终归于达观。
    famous: [长风破浪会有时，直挂云帆济沧海, 停杯投箸不能食，拔剑四顾心茫然]
    source: 詹瑛《李白诗文系年》系天宝三载将去长安时作
  - title: 梦游天姥吟留别
    year: 746
    city: 越州
    genre: 诗
    text: |
      海客谈瀛洲，烟涛微茫信难求；
      越人语天姥，云霞明灭或可睹。
      天姥连天向天横，势拔五岳掩赤城。
      天台四万八千丈，对此欲倒东南倾。
      我欲因之梦吴越，一夜飞度镜湖月。
      湖月照我影，送我至剡溪。
      谢公宿处今尚在，渌水荡漾清猿啼。
      脚著谢公屐，身登青云梯。
      半壁见海日，空中闻天鸡。
      千岩万转路不定，迷花倚石忽已暝。
      熊咆龙吟殷岩泉，栗深林兮惊层巅。
      云青青兮欲雨，水澹澹兮生烟。
      列缺霹雳，丘峦崩摧。
      洞天石扉，訇然中开。
      青冥浩荡不见底，日月照耀金银台。
      霓为衣兮风为马，云之君兮纷纷而来下。
      虎鼓瑟兮鸾回车，仙之人兮列如麻。
      忽魂悸以魄动，恍惊起而长嗟。
      惟觉时之枕席，失向来之烟霞。
      世间行乐亦如此，古来万事东流水。
      别君去兮何时还？且放白鹿青崖间，须行即骑访名山。
      安能摧眉折腰事权贵，使我不得开心颜！
    background: 天宝五载南游吴越，留别东鲁诸公，借梦游天姥抒放还后蔑视权贵、求仙遁世之志。
    famous: [安能摧眉折腰事权贵，使我不得开心颜, 天姥连天向天横，势拔五岳掩赤城]
    source: 詹瑛《李白诗文系年》系天宝五载吴越之行
  - title: 将进酒
    year: 745
    city: 宋州
    genre: 诗
    text: |
      君不见，黄河之水天上来，奔流到海不复回。
      君不见，高堂明镜悲白发，朝如青丝暮成雪。
      人生得意须尽欢，莫使金樽空对月。
      天生我材必有用，千金散尽还复来。
      烹羊宰牛且为乐，会须一饮三百杯。
      岑夫子，丹丘生，将进酒，杯莫停。
      与君歌一曲，请君为我倾耳听。
      钟鼓馔玉不足贵，但愿长醉不复醒。
      古来圣贤皆寂寞，惟有饮者留其名。
      陈王昔时宴平乐，斗酒十千恣欢谑。
      主人何为言少钱，径须沽取对君酌。
      五花马，千金裘，呼儿将出换美酒，与尔同销万古愁。
    background: 赐金放还后漫游梁宋，与岑勋、元丹丘饮酒登高，借酒抒发怀才不遇之愤与及时行乐之慨。
    famous: [天生我材必有用，千金散尽还复来, 君不见，黄河之水天上来，奔流到海不复回, 古来圣贤皆寂寞，惟有饮者留其名]
    source: 詹瑛《李白诗文系年》系天宝四载前后梁宋作
    uncertain: 系年系地有歧说：詹瑛主天宝四载前后梁宋说；另有开元间梁宋说、嵩山元丹丘处作说。今从梁宋说（嵩山未注册于坐标表，且梁宋说证据较充分）
  - title: 赠汪伦
    year: 755
    city: 宣城
    genre: 诗
    text: |
      李白乘舟将欲行，忽闻岸上踏歌声。
      桃花潭水深千尺，不及汪伦送我情。
    background: 游泾县（宣城一带）桃花潭，村人汪伦以酒相待，临行汪伦踏歌相送，白作此赠别。
    famous: [桃花潭水深千尺，不及汪伦送我情]
    source: 詹瑛《李白诗文系年》系天宝末宣城泾县作
  - title: 秋浦歌十七首·其十五
    year: 754
    city: 秋浦
    genre: 诗
    text: |
      白发三千丈，缘愁似个长。
      不知明镜里，何处得秋霜。
    background: 天宝十三载游秋浦（今安徽池州），感年华老大、世乱将作，作《秋浦歌》十七首，此其十五。
    famous: [白发三千丈，缘愁似个长]
    source: 詹瑛《李白诗文系年》系天宝十三载秋浦
  - title: 宣州谢朓楼饯别校书叔云
    year: 754
    city: 宣城
    genre: 诗
    text: |
      弃我去者，昨日之日不可留；
      乱我心者，今日之日多烦忧。
      长风万里送秋雁，对此可以酣高楼。
      蓬莱文章建安骨，中间小谢又清发。
      俱怀逸兴壮思飞，欲上青天揽明月。
      抽刀断水水更流，举杯消愁愁更愁。
      人生在世不称意，明朝散发弄扁舟。
    background: 天宝十三载在宣城，于谢朓楼饯别族叔李云（校书郎），感怀才不遇、时局可忧，抒遁世之思。
    famous: [俱怀逸兴壮思飞，欲上青天揽明月, 抽刀断水水更流，举杯消愁愁更愁]
    source: 詹瑛《李白诗文系年》系天宝十三载宣城
  - title: 永王东巡歌十一首·其二
    year: 757
    city: 浔阳
    genre: 诗
    text: |
      三川北虏乱如麻，四海南奔似永嘉。
      但用东山谢安石，为君谈笑静胡沙。
    background: 至德二载入永王李璘幕，永王沿江东巡，白作组歌颂之，以谢安自比，期平定安史之乱。
    famous: [但用东山谢安石，为君谈笑静胡沙]
    source: 詹瑛《李白诗文系年》系至德二载浔阳永王幕中
  - title: 早发白帝城
    year: 759
    city: 夔州
    genre: 诗
    text: |
      朝辞白帝彩云间，千里江陵一日还。
      两岸猿声啼不住，轻舟已过万重山。
    background: 乾元二年长流夜郎途中，行至白帝城（夔州）忽闻赦书，惊喜乘舟东还，朝发白帝、暮至江陵，作此记其轻快。
    famous: [两岸猿声啼不住，轻舟已过万重山, 朝辞白帝彩云间，千里江陵一日还]
    source: 新唐书·文艺传中「遇赦还」；詹瑛《李白诗文系年》系乾元二载白帝城遇赦
  - title: 望庐山瀑布
    year: 756
    city: 浔阳
    genre: 诗
    text: |
      日照香炉生紫烟，遥看瀑布挂前川。
      飞流直下三千尺，疑是银河落九天。
    background: 安史乱起避地庐山（浔阳），游庐山香炉峰观瀑布作此，极写瀑布之奇伟。
    famous: [飞流直下三千尺，疑是银河落九天]
    source: 詹瑛《李白诗文系年》系至德元载前后庐山避乱时
  - title: 闻王昌龄左迁龙标遥有此寄
    year: 753
    city: 宣城
    genre: 诗
    text: |
      杨花落尽子规啼，闻道龙标过五溪。
      我寄愁心与明月，随君直到夜郎西。
    background: 闻王昌龄贬龙标尉，遥寄此诗以明月托愁心。时李白漫游江南宣城一带。
    famous: [我寄愁心与明月，随君直到夜郎西]
    source: 詹瑛《李白诗文系年》系天宝十二载前后江南漫游时
    uncertain: 系年系地难确：闻王昌龄左迁约在天宝七载至十二载间，李白行踪不定，姑系天宝末江南漫游时，宣城为当时常居地之一
  - title: 赠孟浩然
    year: 728
    city: 江夏
    genre: 诗
    text: |
      吾爱孟夫子，风流天下闻。
      红颜弃轩冕，白首卧松云。
      醉月频中圣，迷花不事君。
      高山安可仰，徒此揖清芬。
    background: 与孟浩然交游于江夏一带，慕其弃官隐居之风，作此相赠。
    famous: [红颜弃轩冕，白首卧松云]
    source: 詹瑛《李白诗文系年》系开元十六年前后江夏交游时
