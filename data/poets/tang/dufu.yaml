works:
  - title: 望岳
    year: 736
    city: 泰山
    genre: 诗
    text: |
      岱宗夫如何？齐鲁青未了。
      造化钟神秀，阴阳割昏晓。
      荡胸生曾云，决眦入归鸟。
      会当凌绝顶，一览众山小。
    background: 开元二十四年漫游齐赵，至泰山（岱宗）远望，抒少壮凌云之志，为现存杜诗中较早的一首。
    famous: [会当凌绝顶，一览众山小, 造化钟神秀，阴阳割昏晓]
    source: 仇兆鳌《杜诗详注》系《望岳》于开元二十四五年漫游齐赵时
  - title: 兵车行
    year: 751
    city: 长安
    genre: 诗
    text: |
      车辚辚，马萧萧，行人弓箭各在腰。
      耶娘妻子走相送，尘埃不见咸阳桥。
      牵衣顿足拦道哭，哭声直上干云霄。
      道旁过者问行人，行人但云点行频。
      或从十五北防河，便至四十西营田。
      去时里正与裹头，归来头白还戍边。
      边庭流血成海水，武皇开边意未已。
      君不闻，汉家山东二百州，千村万落生荆杞。
      纵有健妇把锄犁，禾生陇亩无东西。
      况复秦兵耐苦战，被驱不异犬与鸡。
      长者虽有问，役夫敢申恨？
      且如今年冬，未休关西卒。
      县官急索租，租税从何出？
      信知生男恶，反是生女好。
      生女犹得嫁比邻，生男埋没随百草。
      君不见，青海头，古来白骨无人收。
      新鬼烦冤旧鬼哭，天阴雨湿声啾啾。
    background: 天宝十载前后在长安，见征南诏连年用兵、百姓被强征送别之惨状，作此讽玄宗开边黩武，为杜甫最早反映民间疾苦的乐府名篇。
    famous: [边庭流血成海水，武皇开边意未已, 信知生男恶，反是生女好, 耶娘妻子走相送，尘埃不见咸阳桥]
    source: 仇兆鳌《杜诗详注》系《兵车行》于天宝中长安作（用兵南诏在十载前后）
  - title: 丽人行
    year: 753
    city: 长安
    genre: 诗
    text: |
      三月三日天气新，长安水边多丽人。
      态浓意远淑且真，肌理细腻骨肉匀。
      绣罗衣裳照暮春，蹙金孔雀银麒麟。
      头上何所有？翠微盍叶垂鬓唇。
      背后何所见？珠压腰衱稳称身。
      就中云幕椒房亲，赐名大国虢与秦。
      紫驼之峰出翠釜，水精之盘行素鳞。
      犀箸厌饫久未下，鸾刀缕切空纷纶。
      黄门飞鞚不动尘，御厨络绎送八珍。
      箫鼓哀吟感鬼神，宾从杂遝实要津。
      后来鞍马何逡巡，当轩下马入锦茵。
      杨花雪落覆白苹，青鸟飞去衔红巾。
      炙手可热势绝伦，慎莫近前丞相嗔。
    background: 天宝十二载春三月三日上巳节，杨国忠兄妹曲江游宴，杜甫在长安作此极写其骄奢僭越，讽杨氏一门专权。
    famous: [炙手可热势绝伦，慎莫近前丞相嗔, 三月三日天气新，长安水边多丽人]
    source: 仇兆鳌《杜诗详注》系《丽人行》于天宝十二载春长安
  - title: 自京赴奉先县咏怀五百字
    year: 755
    city: 长安
    genre: 诗
    text: |
      杜陵有布衣，老大意转拙。许身一何愚，窃比稷与契。
      居然成濩落，白首甘契阔。盖棺事则已，此志常觊豁。
      穷年忧黎元，叹息肠内热。非无江海志，潇洒送日月。
      生逢尧舜君，不忍便永诀。
      岁暮百草零，疾风高冈裂。天衢阴峥嵘，客子中夜发。
      霜严衣带断，指直不得结。凌晨过骊山，御榻在嵽嵲。
      蚩尤塞寒空，蹴踏崖谷滑。瑶池气郁律，羽林相摩戛。
      君臣留欢娱，乐动殷樛葛。赐浴皆长缨，与宴非短褐。
      彤庭所分帛，本自寒女出。鞭挞其夫家，聚敛贡城阙。
      圣人筐篚恩，实欲邦国活。臣如忽至理，君岂弃此物。
      多士盈朝廷，仁者宜战栗。况闻内金盘，尽在卫霍室。
      中堂有神仙，烟雾蒙玉质。煖客貂鼠裘，悲管逐清瑟。
      劝客驼蹄羹，霜橙压香橘。朱门酒肉臭，路有冻死骨。
      荣枯咫尺异，惆怅难再述。
    background: 天宝十四载冬，杜甫自长安赴奉先县（今陕西蒲城）探家，途经骊山见玄宗君臣欢娱，到家幼子已饿死，愤而作此五百字长诗，自述怀抱并刺时政。此为节录。
    famous: [朱门酒肉臭，路有冻死骨, 穷年忧黎元，叹息肠内热]
    source: 仇兆鳌《杜诗详注》系《自京赴奉先县咏怀五百字》于天宝十四载冬自京赴奉先途中
    uncertain: 奉先县（今陕西蒲城）未注册于坐标表，诗作于自长安赴奉先途中，暂系出发地长安
  - title: 春望
    year: 757
    city: 长安
    genre: 诗
    text: |
      国破山河在，城春草木深。
      感时花溅泪，恨别鸟惊心。
      烽火连三月，家书抵万金。
      白头搔更短，浑欲不胜簪。
    background: 至德二载三月，杜甫陷于安史叛军占领的长安，见国破城荒，感时恨别，作此千古名篇。
    famous: [国破山河在，城春草木深, 烽火连三月，家书抵万金, 感时花溅泪，恨别鸟惊心]
    source: 仇兆鳌《杜诗详注》系《春望》于至德二载三月长安陷贼时
  - title: 月夜
    year: 756
    city: 长安
    genre: 诗
    text: |
      今夜鄜州月，闺中只独看。
      遥怜小儿女，未解忆长安。
      香雾云鬟湿，清辉玉臂寒。
      何时倚虚幌，双照泪痕干。
    background: 至德元载杜甫陷贼长安，望月思念远在鄜州（今陕西富县）的妻子儿女，从对方着笔写相思。
    famous: [今夜鄜州月，闺中只独看, 香雾云鬟湿，清辉玉臂寒]
    source: 仇兆鳌《杜诗详注》系《月夜》于至德元载陷贼长安时
  - title: 石壕吏
    year: 759
    city: 洛阳
    genre: 诗
    text: |
      暮投石壕村，有吏夜捉人。老翁逾墙走，老妇出门看。
      吏呼一何怒！妇啼一何苦！
      听妇前致词：三男邺城戍。一男附书至，二男新战死。
      存者且偷生，死者长已矣！室中更无人，惟有乳下孙。
      有孙母未去，出入无完裙。老妪力虽衰，请从吏夜归。
      急应河阳役，犹得备晨炊。夜久语声绝，如闻泣幽咽。
      天明登前途，独与老翁别。
    background: 乾元二年春，杜甫自洛阳返华州途中，夜宿石壕村（今河南陕县，近潼关），见官吏夜捉丁壮，老妇应役，作「三吏」之一。
    famous: [暮投石壕村，有吏夜捉人, 吏呼一何怒！妇啼一何苦！]
    source: 仇兆鳌《杜诗详注》系《石壕吏》于乾元二年春自洛阳返华州途中
    uncertain: 石壕村（今河南陕县，近潼关）未注册于坐标表，潼关亦未注册，暂系出发地洛阳；杜甫时任华州司功参军，华州亦未注册
  - title: 茅屋为秋风所破歌
    year: 761
    city: 成都
    genre: 诗
    text: |
      八月秋高风怒号，卷我屋上三重茅。茅飞渡江洒江郊，高者挂罥长林梢，下者飘转沉塘坳。
      南村群童欺我老无力，忍能对面为盗贼。公然抱茅入竹去，唇焦口燥呼不得，归来倚杖自叹息。
      俄顷风定云墨色，秋天漠漠向昏黑。布衾多年冷似铁，娇儿恶卧踏里裂。床头屋漏无干处，雨脚如麻未断绝。自经丧乱少睡眠，长夜沾湿何由彻！
      安得广厦千万间，大庇天下寒士俱欢颜！风雨不动安如山。呜呼！何时眼前突兀见此屋，吾庐独破受冻死亦足！
    background: 上元二年八月，成都草堂为秋风所破，大雨漏夜，杜甫由己及人，抒「安得广厦千万间」之宏愿，为杜诗中忧民深情之代表作。
    famous: [安得广厦千万间，大庇天下寒士俱欢颜, 布衾多年冷似铁，娇儿恶卧踏里裂]
    source: 仇兆鳌《杜诗详注》系《茅屋为秋风所破歌》于上元二年八月成都草堂
  - title: 蜀相
    year: 760
    city: 成都
    genre: 诗
    text: |
      丞相祠堂何处寻，锦官城外柏森森。
      映阶碧草自春色，隔叶黄鹂空好音。
      三顾频烦天下计，两朝开济老臣心。
      出师未捷身先死，长使英雄泪满襟。
    background: 上元元年初到成都，访诸葛武侯祠，追怀其「三顾」「两朝」之功与「出师未捷」之憾，借古抒怀。
    famous: [出师未捷身先死，长使英雄泪满襟, 三顾频烦天下计，两朝开济老臣心]
    source: 仇兆鳌《杜诗详注》系《蜀相》于上元元年初至成都访武侯祠时
  - title: 春夜喜雨
    year: 761
    city: 成都
    genre: 诗
    text: |
      好雨知时节，当春乃发生。
      随风潜入夜，润物细无声。
      野径云俱黑，江船火独明。
      晓看红湿处，花重锦官城。
    background: 居成都草堂时，春夜逢雨，喜其润物适时，作此清新之作，写尽春雨之神。
    famous: [随风潜入夜，润物细无声, 好雨知时节，当春乃发生]
    source: 仇兆鳌《杜诗详注》系《春夜喜雨》于上元二年成都草堂
  - title: 闻官军收河南河北
    year: 763
    city: 梓州
    genre: 诗
    text: |
      剑外忽传收蓟北，初闻涕泪满衣裳。
      却看妻子愁何在，漫卷诗书喜欲狂。
      白日放歌须纵酒，青春作伴好还乡。
      即从巴峡穿巫峡，便下襄阳向洛阳。
    background: 广德元年春，杜甫在梓州闻官军收复河南河北、安史之乱平定，惊喜欲狂，作此「生平第一快诗」，畅想还乡水路。
    famous: [白日放歌须纵酒，青春作伴好还乡, 剑外忽传收蓟北，初闻涕泪满衣裳, 即从巴峡穿巫峡，便下襄阳向洛阳]
    source: 仇兆鳌《杜诗详注》系《闻官军收河南河北》于广德元年春梓州
  - title: 旅夜书怀
    year: 765
    city: 渝州
    genre: 诗
    text: |
      细草微风岸，危樯独夜舟。
      星垂平野阔，月涌大江流。
      名岂文章著，官应老病休。
      飘飘何所似，天地一沙鸥。
    background: 永泰元年严武卒后，杜甫离成都乘舟东下，经渝州（今重庆）、忠州一带夜泊，感漂泊无依，作此书怀。
    famous: [星垂平野阔，月涌大江流, 飘飘何所似，天地一沙鸥]
    source: 仇兆鳌《杜诗详注》系《旅夜书怀》于永泰元年离蜀舟行经渝州时
    uncertain: 此诗舟行途中作，经渝州、忠州一带，忠州亦有说；今系渝州
  - title: 秋兴八首·其一
    year: 766
    city: 夔州
    genre: 诗
    text: |
      玉露凋伤枫树林，巫山巫峡气萧森。
      江间波浪兼天涌，塞上风云接地阴。
      丛菊两开他日泪，孤舟一系故园心。
      寒衣处处催刀尺，白帝城高急暮砧。
    background: 大历元年秋流寓夔州，见巫山巫峡秋气萧森，感身世飘零、故园难归，作《秋兴八首》组诗，此其一，为七律组诗之冠。
    famous: [丛菊两开他日泪，孤舟一系故园心, 玉露凋伤枫树林，巫山巫峡气萧森]
    source: 仇兆鳌《杜诗详注》系《秋兴八首》于大历元年秋夔州
  - title: 登高
    year: 767
    city: 夔州
    genre: 诗
    text: |
      风急天高猿啸哀，渚清沙白鸟飞回。
      无边落木萧萧下，不尽长江滚滚来。
      万里悲秋常作客，百年多病独登台。
      艰难苦恨繁霜鬓，潦倒新停浊酒杯。
    background: 大历二年重阳节，杜甫在夔州登高远眺，萧瑟秋景激起身世飘零、老病孤愁之慨，被后人誉为「古今七律第一」。
    famous: [无边落木萧萧下，不尽长江滚滚来, 万里悲秋常作客，百年多病独登台]
    source: 仇兆鳌《杜诗详注》系《登高》于大历二年秋夔州
  - title: 登岳阳楼
    year: 768
    city: 岳阳
    genre: 诗
    text: |
      昔闻洞庭水，今上岳阳楼。
      吴楚东南坼，乾坤日夜浮。
      亲朋无一字，老病有孤舟。
      戎马关山北，凭轩涕泗流。
    background: 大历三年冬，杜甫出峡后漂泊至岳州（今岳阳），登岳阳楼望洞庭湖，感身世之孤与关山之忧，作此名篇。
    famous: [吴楚东南坼，乾坤日夜浮, 戎马关山北，凭轩涕泗流]
    source: 仇兆鳌《杜诗详注》系《登岳阳楼》于大历三年冬岳阳
  - title: 江南逢李龟年
    year: 770
    city: 潭州
    genre: 诗
    text: |
      岐王宅里寻常见，崔九堂前几度闻。
      正是江南好风景，落花时节又逢君。
    background: 大历五年，杜甫漂泊至潭州（今长沙），与开元、天宝间名动一时的音乐家李龟年重逢，抚今追昔，作此绝句，为杜诗中绝笔之一。
    famous: [正是江南好风景，落花时节又逢君, 岐王宅里寻常见，崔九堂前几度闻]
    source: 仇兆鳌《杜诗详注》系《江南逢李龟年》于大历五年潭州
